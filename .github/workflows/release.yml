name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify version tag
        shell: bash
        run: |
          version="$(python -c 'from src.version import VERSION; print(VERSION)')"
          test "$GITHUB_REF_NAME" = "v${version}"
      - name: Run tests
        run: python -m pytest
      - name: Rebuild checked-in examples
        run: python -m scripts.build_example_outputs
      - name: Verify examples are reproducible
        run: git diff --exit-code -- examples/sample_contract.md examples/sample_review.html
      - name: Scan tracked text for likely secrets
        shell: bash
        run: |
          if git grep -nI -E 'sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY' -- . ':(exclude).github/workflows/release.yml'; then
            echo "Potential secret detected"
            exit 1
          fi
      - name: Build downloadable archive
        shell: bash
        run: |
          archive="contract-reviewer-${GITHUB_REF_NAME}.zip"
          git archive \
            --format=zip \
            --prefix="contract-reviewer-${GITHUB_REF_NAME}/" \
            --output="$archive" \
            "$GITHUB_SHA"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          archive="contract-reviewer-${GITHUB_REF_NAME}.zip"
          gh release create "$GITHUB_REF_NAME" "$archive" \
            --verify-tag \
            --title "Contract Reviewer ${GITHUB_REF_NAME}" \
            --generate-notes
