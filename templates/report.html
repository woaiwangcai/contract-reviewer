<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>$title</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211b;
      --muted: #5e6862;
      --line: #d8ddd9;
      --soft: #f3f6f4;
      --accent: #087f5b;
      --accent-dark: #075d45;
      --warning: #a34613;
    }
    * { box-sizing: border-box; }
    html { background: #eef1ef; }
    body {
      margin: 0;
      color: var(--ink);
      background: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.72;
    }
    header {
      padding: 30px max(24px, calc((100vw - 1040px) / 2));
      color: #fff;
      background: #17211b;
      border-bottom: 5px solid var(--accent);
    }
    header p { margin: 0; color: #cbd5cf; font-size: 14px; }
    header h1 { margin: 4px 0 0; font-size: 26px; line-height: 1.3; }
    main {
      width: min(100% - 48px, 1040px);
      margin: 38px auto 72px;
    }
    h1, h2, h3 { line-height: 1.35; }
    main > h1 { font-size: 30px; margin: 0 0 28px; }
    h2 {
      margin: 36px 0 16px;
      padding-bottom: 8px;
      font-size: 21px;
      border-bottom: 1px solid var(--line);
    }
    h3 { margin: 28px 0 12px; font-size: 17px; }
    p, ul, ol { margin: 0 0 16px; }
    a { color: var(--accent-dark); }
    table {
      width: 100%;
      margin: 16px 0 28px;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 11px 12px;
      text-align: left;
      vertical-align: top;
      border: 1px solid var(--line);
      overflow-wrap: anywhere;
    }
    th { background: var(--soft); font-weight: 700; }
    tbody tr:nth-child(even) { background: #fafcfb; }
    blockquote {
      margin: 20px 0;
      padding: 12px 18px;
      color: var(--muted);
      background: var(--soft);
      border-left: 4px solid var(--accent);
    }
    code {
      padding: 2px 5px;
      background: var(--soft);
      border: 1px solid var(--line);
    }
    footer {
      padding: 22px max(24px, calc((100vw - 1040px) / 2));
      color: var(--muted);
      background: var(--soft);
      border-top: 1px solid var(--line);
      font-size: 13px;
    }
    @media (max-width: 720px) {
      header { padding: 24px 20px; }
      header h1 { font-size: 21px; }
      main { width: calc(100% - 32px); margin-top: 28px; overflow-x: auto; }
      main > h1 { font-size: 25px; }
      table { min-width: 720px; }
    }
    @media print {
      html, body { background: #fff; }
      header { padding: 18mm 16mm 10mm; }
      main { width: auto; margin: 12mm 16mm; }
      footer { padding: 8mm 16mm; }
      table, blockquote { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <p>CONTRACT REVIEWER</p>
    <h1>$title</h1>
  </header>
  <main>
    $content
  </main>
  <footer>AI 生成内容仅用于辅助审查，重要结论应结合交易背景进行人工复核。</footer>
</body>
</html>
